name: Feature request
description: Suggest an improvement for Gamico Claim.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What feature or improvement do you want?
      placeholder: Brief feature summary
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem does this solve for you?
      placeholder: Describe your real-world use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should this feature work?
      placeholder: Describe behavior, configuration, and output you expect
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative ideas?
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and impact
      description: Any expected impact on Linux/Windows flows, scheduling, or notifications?
    validations:
      required: false
